<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SkyCast AI | Climate Orchestrator 2026</title>
    <link rel="stylesheet" href="style.css">
    <!-- Google Fonts: Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- Marked for Markdown rendering -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.1.6/purify.min.js"></script>
</head>
<body>
    <div id="root"></div>

    <!-- React & Babel for SPA logic -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        const TOOL_LABELS = {
            get_coordinates:           'Geolocalizzazione',
            get_weather_forecast:      'Previsioni meteo',
            get_historical_climatology:'Dati storici',
            get_air_quality:           "Qualità dell'aria",
            get_marine_data:           'Dati marini',
            get_pollen_data:           'Dati polline',
            get_tide_forecast:         'Previsioni maree',
        };

        function ToolPills({ tools }) {
            if (!tools || tools.length === 0) return null;
            return (
                <div className="tool-pills">
                    {tools.map((t, i) => (
                        <span key={i} className={`tool-pill ${t.status === 'done' ? 'done' : ''}`}>
                            {t.status === 'running'
                                ? <span className="tool-spinner"></span>
                                : <span className="tool-check">✓</span>
                            }
                            {TOOL_LABELS[t.name] || t.name}
                        </span>
                    ))}
                </div>
            );
        }

        function MarkdownMessage({ content, streaming, tools }) {
            const displayContent = streaming && content ? content + '|' : content;
            const raw = marked.parse(displayContent || '', { breaks: true, gfm: true });
            const html = DOMPurify.sanitize(raw);
            return (
                <div>
                    <ToolPills tools={tools} />
                    <div className="markdown-body" dangerouslySetInnerHTML={{ __html: html }} />
                </div>
            );
        }

        function App() {
            const [query, setQuery] = useState('');
            const [chat, setChat] = useState([]);
            const [history, setHistory] = useState([]);
            const [loading, setLoading] = useState(false);
            const [modelName, setModelName] = useState('...');
            const [userContext, setUserContext] = useState({
                lat: null,
                lon: null,
                date: new Date().toLocaleDateString('it-IT')
            });
            const scrollRef = useRef(null);
            const inputRef = useRef(null);

            useEffect(() => {
                fetch('/api/model')
                    .then(r => r.json())
                    .then(d => setModelName(d.model))
                    .catch(() => setModelName('gemini'));
            }, []);

            useEffect(() => {
                if (navigator.geolocation) {
                    navigator.geolocation.getCurrentPosition(
                        (position) => {
                            setUserContext(prev => ({
                                ...prev,
                                lat: position.coords.latitude,
                                lon: position.coords.longitude
                            }));
                        },
                        (error) => {
                            console.warn("Geolocalizzazione negata o non disponibile:", error.message);
                        }
                    );
                }
            }, []);

            useEffect(() => {
                if (scrollRef.current) {
                    scrollRef.current.scrollTop = scrollRef.current.scrollHeight;
                }
                lucide.createIcons();
                // Focus persistente
                if (inputRef.current) inputRef.current.focus();
            }, [chat, loading]);

            const handleSubmit = async (e) => {
                e.preventDefault();
                if (!query.trim() || loading) return;

                const userMsg = { role: 'user', parts: [{ text: query }] };
                const currentQuery = query;
                const newChat = [...chat, { role: 'user', text: currentQuery }, { role: 'model', text: '', streaming: true, tools: [] }];

                setChat(newChat);
                setQuery('');
                setLoading(true);

                try {
                    const response = await fetch('/api/query', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json', 'Accept': 'text/event-stream' },
                        body: JSON.stringify({ query: currentQuery, history, userContext })
                    });

                    const reader = response.body.getReader();
                    const decoder = new TextDecoder();
                    let buffer = '';
                    let accumulatedText = '';
                    let textStarted = false;

                    while (true) {
                        const { done, value } = await reader.read();
                        if (done) break;

                        buffer += decoder.decode(value, { stream: true });
                        const lines = buffer.split('\n');
                        buffer = lines.pop();

                        for (const line of lines) {
                            if (!line.startsWith('data: ')) continue;
                            const raw = line.slice(6);
                            if (raw === '[DONE]') {
                                setChat(prev => {
                                    const updated = [...prev];
                                    updated[updated.length - 1] = { role: 'model', text: accumulatedText };
                                    return updated;
                                });
                                const modelMsg = { role: 'model', parts: [{ text: accumulatedText }] };
                                setHistory(prev => [...prev, userMsg, modelMsg]);
                                continue;
                            }
                            let parsed;
                            try { parsed = JSON.parse(raw); } catch (_) { continue; }

                            if (parsed.toolCall) {
                                setChat(prev => {
                                    const updated = [...prev];
                                    const last = { ...updated[updated.length - 1] };
                                    last.tools = [...(last.tools || []), { name: parsed.toolCall, status: 'running' }];
                                    updated[updated.length - 1] = last;
                                    return updated;
                                });
                            } else if (parsed.chunk) {
                                if (!textStarted) {
                                    textStarted = true;
                                    setChat(prev => {
                                        const updated = [...prev];
                                        const last = { ...updated[updated.length - 1] };
                                        last.tools = (last.tools || []).map(t => ({ ...t, status: 'done' }));
                                        updated[updated.length - 1] = last;
                                        return updated;
                                    });
                                }
                                accumulatedText += parsed.chunk;
                                setChat(prev => {
                                    const updated = [...prev];
                                    const last = { ...updated[updated.length - 1] };
                                    last.text = accumulatedText;
                                    last.streaming = true;
                                    updated[updated.length - 1] = last;
                                    return updated;
                                });
                            } else if (parsed.error === 'quota') {
                                const waitMsg = `Soglia raggiunta. Riprova tra ${parsed.retryAfter || 60} secondi.`;
                                setChat(prev => {
                                    const updated = [...prev];
                                    updated[updated.length - 1] = { role: 'model', text: waitMsg, error: true };
                                    return updated;
                                });
                            } else if (parsed.error) {
                                setChat(prev => {
                                    const updated = [...prev];
                                    updated[updated.length - 1] = { role: 'model', text: 'Si è verificato un errore interno al server.', error: true };
                                    return updated;
                                });
                            }
                        }
                    }
                } catch (err) {
                    setChat(prev => {
                        const updated = [...prev];
                        updated[updated.length - 1] = { role: 'model', text: 'Errore di connessione al server.', error: true };
                        return updated;
                    });
                } finally {
                    setLoading(false);
                    setTimeout(() => inputRef.current?.focus(), 50);
                }
            };

            return (
                <div className="app-container">
                    <header className="header">
                        <div className="logo">
                            <i data-lucide="cloud-sun" className="neon-blue"></i>
                            <h1>SkyCast <span>AI</span></h1>
                        </div>
                        <div className="status-badge">
                            <span className="dot"></span> {modelName}
                        </div>
                    </header>

                    <main className="chat-area" ref={scrollRef}>
                        {chat.length === 0 && (
                            <div className="welcome-msg">
                                <i data-lucide="sparkles" size="48"></i>
                                <h2>Benvenuto nel futuro del clima</h2>
                                <p>Chiedimi previsioni attuali o confronta i dati storici dal 1940.</p>
                            </div>
                        )}
                        {chat.map((msg, i) => (
                            <div key={i} className={`message-wrapper ${msg.role}`}>
                                <div className="message-content">
                                    <span className="role-tag">{msg.role === 'user' ? 'Tu' : 'SkyCast'}</span>
                                    {msg.role === 'model' ? (
                                        <MarkdownMessage content={msg.text} streaming={msg.streaming} tools={msg.tools} />
                                    ) : (
                                        <p>{msg.text}</p>
                                    )}
                                </div>
                            </div>
                        ))}
                        {loading && !chat.some(m => m.streaming) && (
                            <div className="message-wrapper model loading">
                                <div className="typing-indicator">
                                    <span></span><span></span><span></span>
                                </div>
                            </div>
                        )}
                    </main>

                    <form className="input-area" onSubmit={handleSubmit}>
                        <div className="input-glass">
                            <input 
                                type="text" 
                                ref={inputRef}
                                value={query}
                                onChange={(e) => setQuery(e.target.value)}
                                placeholder="Chiedi qualcosa a SkyCast..."
                                disabled={loading}
                                autoFocus
                            />
                            <button type="submit" disabled={loading || !query.trim()}>
                                <i data-lucide="send"></i>
                            </button>
                        </div>
                    </form>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
